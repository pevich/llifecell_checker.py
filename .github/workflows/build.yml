name: Build Windows EXE

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE (no console)
        run: |
          pyinstaller --onefile --noconsole --name lifecell_checker lifecell_checker.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifecell_checker_exe
          path: dist/lifecell_checker.exe
